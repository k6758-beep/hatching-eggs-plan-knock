<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搶票大作戰 × 五年養成蛋</title>
<meta name="description" content="搶到門票，領一顆夢想蛋，花五年把它養成職人夥伴。正修科大五專 116 學年度升學小遊戲。">
<meta name="theme-color" content="#131A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px;min-height:100%;color-scheme:var(--scheme,light)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 32px}
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 0;background:var(--hud,var(--bg))}
#prog{flex:1;min-width:0}
#prog .lab{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog .bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:3px}
#prog .bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.hbtn{flex:none;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 9px;font-size:12.5px;font-weight:700;line-height:1.25;color:var(--card-ink);text-align:center}
.hbtn b{display:block;font-size:17px;line-height:1.15}
.hbtn.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
#stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--card);color:var(--card-ink);border-radius:var(--r);padding:18px 16px;border:2px solid var(--line)}
h1{font-size:32px;line-height:1.25;font-weight:900;font-family:var(--display);text-wrap:balance}
h2{font-size:21px;line-height:1.35;font-weight:900;font-family:var(--display);margin-bottom:6px;text-wrap:balance}
h3{font-size:17px;font-weight:900;margin:14px 0 4px}
p+p{margin-top:8px}
.small{font-size:14.5px}.muted{color:var(--muted2)}
.kicker{font-size:14px;font-weight:900;color:var(--kick)}
.cta{display:block;width:100%;background:var(--pri);color:var(--pri-ink);font-weight:900;font-size:18px;padding:14px 16px;border-radius:var(--r);box-shadow:0 4px 0 var(--pri-d);text-align:center;text-decoration:none}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.cta[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.cta.ghost{background:var(--card);color:var(--card-ink);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:11px 14px}
.cta.line{background:#06C755;color:#fff;box-shadow:0 4px 0 #04883a}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--opt);color:var(--card-ink);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:16.5px;line-height:1.45}
.opt>span:first-child{font-size:26px;flex:none}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--sel)}
.opt.ok{border-color:#1FA37A;background:#E3F7EE;color:#0d3b2c}
.opt.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sel);font-size:15.5px;font-weight:700;color:var(--card-ink)}
.tag{display:inline-block;font-size:13px;font-weight:900;padding:1px 9px;border-radius:99px;color:#fff;background:var(--c,#6B7785);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:15.5px}
dl.kv dt{font-weight:900;white-space:nowrap}
ul.plain{padding-left:1.2em;font-size:15.5px}
.warn{background:#FFE600;color:#7A0025;border:3px solid #E6004C;border-radius:14px;padding:11px 13px;font-weight:900;font-size:16px;line-height:1.55}
.warn u{text-decoration-thickness:2px}
/* 報到 */
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.av{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--c,#eee);display:grid;place-items:center;font-size:30px;overflow:hidden;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 4px var(--sel)}
.me{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--c,#eee);flex:none;border:3px solid #fff}
.me img{width:100%;height:100%;object-fit:cover}
input.name{width:100%;font:inherit;font-weight:700;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#14213D;margin-top:6px}
label.f{display:block;font-weight:900;font-size:15.5px;margin-top:12px}
/* 彈出視窗 */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,40,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet,var(--card));color:var(--card-ink);width:100%;max-width:540px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--sheet,var(--card));padding:10px 0 8px;z-index:1}
.sheet header h2{flex:1;margin:0}
.x{font-size:15px;font-weight:900;border:2px solid var(--line);border-radius:10px;padding:4px 12px;background:var(--opt)}
#toasts{position:fixed;left:0;right:0;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#14213D;color:#fff;font-weight:700;font-size:15px;padding:9px 16px;border-radius:99px;animation:up .25s;max-width:92%}
/* 關鍵時間 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:14px;font-weight:900;padding:5px 12px;border-radius:99px;border:2px solid var(--c,var(--line));color:var(--card-ink);background:var(--opt)}
.chip[aria-pressed=true]{background:var(--c,#14213D);color:#fff}
.tl{list-style:none;padding:0;margin:10px 0 0 8px;border-left:4px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 16px}
.tl li::before{content:"";position:absolute;left:-10px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c,#6B7785);border:2px solid var(--card)}
.tl .mon{font-weight:900;font-size:15px;color:var(--muted2);padding-bottom:6px}
.tl .mon::before{display:none}
.tl .when{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.tl .what{font-weight:700}
.tl .past{opacity:.55}
.tl .quit .what{display:inline-block;background:#FFE600;color:#7A0025;border:2px solid #E6004C;border-radius:8px;padding:0 8px;font-weight:900}
.tl a.gc{display:inline-block;margin-top:3px;font-size:14px;font-weight:900;color:var(--link);text-decoration:underline}
.count{background:var(--sel);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15.5px}
.disc{font-size:13px;color:var(--muted2);margin-top:10px}
/* 百寶袋 */
.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--opt);font-weight:900;font-size:15px;color:var(--card-ink);display:flex;gap:8px;align-items:center;line-height:1.3}
.item span{font-size:24px}
.item.lock{opacity:.5;border-style:dashed;font-weight:700}
.dl{border:2px solid var(--line);border-radius:14px;margin-top:8px;background:var(--opt);overflow:hidden}
.dl summary{font-weight:900;padding:10px 12px;cursor:pointer;border-left:8px solid var(--c)}
.dl .in{padding:4px 12px 12px;font-size:15.5px}
.steps4{display:grid;gap:6px;margin-top:8px;padding:0;list-style:none}
.steps4 li{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15.5px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--opt)}
.steps4 li.on{border-color:var(--acc);background:var(--sel)}
.steps4 i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.dlbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 10px;background:var(--opt)}
.dlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.dlb{background:var(--c);color:#fff;border-radius:10px;padding:8px 4px;font-weight:900;font-size:15px;line-height:1.25}
.dlb small{display:block;font-weight:700;font-size:12px;opacity:.9}
.dlb.all{grid-column:1/-1;background:#14213D;padding:11px 4px;font-size:16px}
.multi .opt{position:relative;padding-right:40px}
.multi .opt[aria-pressed=true]{border-color:var(--acc);background:var(--sel)}
.multi .opt[aria-pressed=true]::after{content:"✓";position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.remind{color:#7A2FE0;font-weight:900}
/* 版面想法：夜晚的售票亭。深藍夜色當底，票券用亮黃與桃紅，蛋與夥伴用薄荷綠。 */
:root{--font:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--display:var(--font);--scheme:dark;
--bg:#131A3A;--ink:#fff;--card:#FFFDF6;--card-ink:#1B2350;--line:#D5D9EE;--pri:#FFD23F;--pri-ink:#1B2350;--pri-d:#B58A00;
--acc:#FF4F8B;--kick:#D81B60;--sel:#FFE9F1;--opt:#fff;--muted:#B9C0E6;--muted2:#5A618C;--link:#2B4BD8;--focus:#3DDBB4;--track:#2A3366;--r:18px;--mint:#3DDBB4}
body{background-image:radial-gradient(circle at 20% 0,#27337a 0,transparent 42%),radial-gradient(circle at 90% 12%,#3a1f5e 0,transparent 36%);background-attachment:fixed}
#hud{background:#131A3Aee}
.marquee{text-align:center;padding:26px 16px 22px;border:3px solid var(--pri);background:#1B2350;color:#fff;position:relative}
.marquee::before{content:"";position:absolute;inset:6px;border:2px dotted #FFD23F88;border-radius:12px;pointer-events:none}
.marquee h1{font-size:40px;color:var(--pri);letter-spacing:.04em}
.marquee .x2{font-size:22px;font-weight:900;color:var(--mint);margin-top:2px}
.marquee .kicker{color:#FF9DBF}
.panels{display:grid;gap:10px}
.panel{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.panel .pic{font-size:44px;text-align:center;line-height:1}
/* 票券 */
.tix{display:grid;gap:10px;margin-top:10px}
.tk{display:block;width:100%;text-align:left;border-radius:14px;background:#fff;color:var(--card-ink);border:2px solid var(--line);border-left:12px solid var(--c);padding:10px 12px;position:relative}
.tk::after{content:"";position:absolute;right:54px;top:0;bottom:0;border-left:2px dashed var(--line)}
.tk .hd{display:flex;gap:8px;align-items:center;font-weight:900;font-size:17px;padding-right:58px}
.tk .st{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:var(--muted2);width:40px;text-align:center;line-height:1.2}
.tk .bd{margin-top:8px;padding-right:58px;font-weight:400}
.tk.open{border-color:var(--c)}
/* 搶票 */
.rail{position:relative;display:flex;height:74px;border-radius:14px;overflow:hidden;background:#232B5C;margin:14px 0 6px}
.rail .seg{display:grid;place-items:center;text-align:center;font-size:13.5px;font-weight:900;color:#fff;line-height:1.25;padding:0}
.rail .seg.w{background:var(--c);cursor:pointer}
.rail .seg.done{filter:saturate(.35) brightness(.8)}
.rail .seg.ex{background:repeating-linear-gradient(45deg,#3a4380,#3a4380 6px,#2c3470 6px,#2c3470 12px);color:#D9DEFF;font-size:12px}
.rail .cur{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 10px 3px #fff9;left:0;pointer-events:none}
.rail .cur::after{content:"▼";position:absolute;top:-2px;left:-7px;font-size:13px;color:#fff}
.months{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted2)}
.grab{font-size:24px;padding:18px;background:var(--acc);color:#fff;box-shadow:0 5px 0 #A91550}
.got{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* 蛋 */
.eggbox{display:grid;place-items:center;padding:6px 0 0}
.eggbox svg{width:170px;height:auto;display:block}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.shake{animation:shk .35s linear 3}
@keyframes shk{25%{transform:translateX(-7px) rotate(-6deg)}75%{transform:translateX(7px) rotate(6deg)}}
.badges{display:flex;gap:6px;justify-content:center;min-height:34px;margin-top:4px}
.badges span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:18px;border:2px solid #fff;animation:pop .5s}
.year{display:flex;gap:6px;margin-bottom:8px}
.year i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.year i.on{background:var(--mint)}
.news{background:#E6FBF5;border:2px solid var(--mint);border-radius:12px;padding:9px 12px;font-size:15.5px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid2 .opt{flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px}
.grid2 .opt small{font-weight:700;color:var(--muted2);font-size:13px}
/* 票根 */
.stub{background:var(--pri);color:#1B2350;border-radius:18px;padding:0;overflow:hidden;position:relative;border:0}
.stub .top{padding:16px 16px 12px;display:flex;gap:12px;align-items:center}
.stub .top .nm{font-size:24px;font-weight:900;line-height:1.25}
.stub .cut{border-top:3px dashed #1B2350;position:relative;margin:0 14px}
.stub .cut::before,.stub .cut::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.stub .cut::before{left:-28px}.stub .cut::after{right:-28px}
.stub .body{padding:12px 16px 16px}
.stub dl.kv dt{color:#5b4a00}
.bar{height:34px;margin-top:10px;background:repeating-linear-gradient(90deg,#1B2350 0 3px,transparent 3px 5px,#1B2350 5px 6px,transparent 6px 10px,#1B2350 10px 14px,transparent 14px 16px)}
#prog .bar{height:8px;margin-top:3px;background:var(--track)}
.marquee .tagline{display:inline-block;margin-top:10px;background:#FF4F8B;color:#fff;font-weight:900;font-size:15px;border-radius:99px;padding:2px 14px}
.marquee .lead1{font-size:26px;font-weight:900;color:#fff;margin-top:12px;line-height:1.3}
h2.mission{background:#1B2350;color:#fff;border-radius:12px;padding:10px 14px;margin-top:6px}
.hl{color:#FFD23F;font-weight:900}
.news.wing{background:#FFF6D6;border-color:#FFB627}
.egg-remind{margin:2px 0 4px}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <button class="hbtn" id="btnBack" aria-label="上一步"><b>←</b>上一步</button>
    <div id="prog"></div>
    <button class="hbtn" id="btnTl" aria-label="關鍵時間"><b>🗓️</b>關鍵時間</button>
    <button class="hbtn" id="btnBag" aria-label="百寶袋"><b>🎒</b>百寶袋</button>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><p style="padding:20px">這個遊戲需要開啟 JavaScript 才能玩。</p></noscript>
<script>
"use strict";
/* =====================================================================
 *  資料層：每年只需要改這一段（學年度、日期、電話、LINE、獎學金、各科介紹）
 *  日期格式一律 "YYYY-MM-DD"（西元）。116 學年度 = 2027 年入學。
 *  來源：116學年度五專招生重要日程表
 * ===================================================================== */
const D = {
  cycle: "116學年度",
  school: { name: "正修科技大學", unit: "招生處", tel: "07-7310203", line: "https://line.me/R/ti/p/@csu1111", lineId: "@csu1111" },
  bonus: "經五專完全免試入學錄取正修並完成註冊，可獲得入學獎學金 5,000 元。",

      rules: ["不採計會考成績，會考前就知道結果", "只能選 1 所學校的 1 個科", "向自己就讀的國中報名", "國中應屆畢業生才能參加"] },
    you: { n: 2, name: "五專優先免試入學", short: "優先免試", color: "#2A76C9",
      when: "會考後（5 月中報名、6 月中公布）",
      rules: ["全國一區，不限地區、學校和科別", "上網最多可以填 30 個志願", "電腦依照你排的順序統一分發"] },
    lian: { n: 3, name: "南區五專聯合免試入學", short: "聯合免試", color: "#17936C",
      when: "優先免試之後（6 月下旬報名、7 月初現場選科）",
      rules: ["分北、中、南三區，每區選 1 所學校報名（正修在南區）", "親自到學校，依順序現場選科並報到", "前兩個管道沒用完的名額會加進來"] },
    xu: { n: 4, name: "五專免試入學續招", short: "免試續招", color: "#7B52C7",
      when: "聯合免試之後（日期由各校公告）",
      rules: ["聯合免試之後還有名額的學校才會辦理", "報名方式和日期請看各校公告"] }
  },
  events: [
    { p: "all", s: "2027-01-15", t: "招生簡章公告", d: "完全免試、優先免試、聯合免試的簡章都在這天公告，可以上網下載。" },
    { p: "all", s: "2027-03-04", e: "2027-03-06", t: "國中教育會考報名", d: "由就讀的國中協助報名。" },
    { p: "wan", s: "2027-04-27", e: "2027-05-03", t: "完全免試報名", d: "向就讀的國中報名，只能選 1 所學校的 1 個科。" },
    { p: "wan", s: "2027-05-13", t: "完全免試錄取公告", d: "會考前就知道結果。" },
    { p: "all", s: "2027-05-15", e: "2027-05-16", t: "國中教育會考", d: "考試日。" },
    { p: "wan", s: "2027-05-17", e: "2027-06-11", t: "完全免試報到", d: "實際報到日期由各校自訂，請看錄取學校的通知。" },

let AC = null;
function beep(seq) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8; });
  } catch (e) {}
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = $("#fx"), g = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FF5C8A", "#FFC93C", "#3DDBB4", "#5B8DEF", "#fff"];
  const P = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, v: 2 + Math.random() * 4, w: 6 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.random() * 5 | 0], s: Math.random() * 2 - 1 }));
  let n = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.y += p.v; p.x += p.s; p.r += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); g.restore(); });
    if (++n < 170) requestAnimationFrame(tick); else g.clearRect(0, 0, c.width, c.height);
  })();
}

function pickPhoto(capture) {
  return new Promise(res => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; if (capture) inp.setAttribute("capture", "user");
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return res(null);
      const url = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        const c = document.createElement("canvas"), n = 240, s = Math.min(im.naturalWidth, im.naturalHeight); c.width = c.height = n;
        c.getContext("2d").drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, n, n);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .85));
      };
      im.onerror = () => { toast("這張照片打不開，換一張試試"); res(null); }; im.src = url;
    };

  });
}

  if (line) { g.fillText(line, x, y); y += lh; }
  return y;
}

  card: { bg: "#FFFDF6", head: "#1B2350", headSub: "#FFD23F", ink: "#1B2350", sub: "#C2185B" },
  warn: "已經報到又想改訂別的場次，須在期限前辦理放棄。",
  skin: {
    wan: { icon: "🐦", nick: "早鳥直達票", analog: "最早開賣的票。一張票指定 1 個座位（1 所學校的 1 個科），會考前就知道有沒有買到。" },
    you: { icon: "🌏", nick: "全台選位票", analog: "一次寫下最多 30 個想坐的位子，電腦會幫你排到順位最前面、還有空位的那一個。" },
    lian: { icon: "🎪", nick: "現場選位票", analog: "親自到售票現場（學校），依順序當場選座位（科別）。前兩張沒賣完的位子也會加進來。" },
    xu: { icon: "➕", nick: "加開場次票", analog: "還有空位的學校會再加開一場，開賣時間看各校公告。" }
  },
  items: [
    { id: "t4", icon: "🎟️", name: "售票時刻表", desc: () => `四張票一張接一張開賣：${steps4HTML()}` },
    { id: "tip", icon: "💡", name: "搶票祕訣", desc: () => `對正修六個科有興趣，建議參加越早的管道，先用「早鳥直達票」拿到入學門票。之後有其他選擇，在期限內辦理放棄就可以。<div style="margin-top:8px">${warnHTML()}</div>` },
    { id: "free", icon: "🪙", name: "專一：免學費", desc: () => ADV.free },
    { id: "lab", icon: "🔬", name: "專二：大學實驗室", desc: () => ADV.lab },
    { id: "cert", icon: "📜", name: "專三：專業證照", desc: () => ADV.cert },
    { id: "intern", icon: "🤝", name: "專四：專題與實習", desc: () => `${ADV.intern}<br>${ADV.later}<br>${ADV.wing}` },
    { id: "degree", icon: "🎓", name: "專五：副學士學位", desc: () => `${ADV.degree}<br>${AFTER.map(a => `${a.icon} <b>${a.name}</b>：${a.d}`).join("<br>")}` },
    { id: "pet", icon: "🐣", name: "我的職人夥伴", desc: () => `<b>${PET[S.dept]}</b>來自 <b>${DEPT[S.dept].name}</b>。${deptHTML(S.dept)}` }
  ],
  scenes: [
    { id: "title", bare: 1, run() {
      stage(`<div class="card marquee"><p class="kicker">正修科技大學五專部｜${D.cycle}</p><h1>搶票大作戰</h1><p class="x2">× 五年養成蛋</p>
        <p class="tagline">認識五專入學方法與個人興趣</p>
        <p class="lead1">搶門票</p><p>走進「夢想孵化館」領一顆只屬於你的蛋。</p><p>花五年把蛋養大，看它變成哪一種職業夥伴！</p>
        <p class="small" style="color:#B9C0E6;margin-top:10px">給國中同學的升學小遊戲，大約 7 分鐘。</p></div>
        <div class="eggbox">${eggSVG(0, "wob")}</div>
        <button class="cta" id="go">開始！先辦會員卡</button><button class="cta ghost" id="resume" hidden>繼續上次的進度</button>`);
      $("#go").onclick = () => { reset(); good(); next(); };
    } },
    { id: "me", lab: "辦會員卡", run() { profileScene({ kicker: "售票亭｜第 1 步", title: "先辦一張會員卡", lead: "搶票要用會員卡。取一個暱稱，再選一張大頭照。", btn: "會員卡辦好了" }); } },
    { id: "story", lab: "聽故事", run() {
      stage(`<div class="card"><p class="kicker">${who()}，歡迎來到售票亭</p><h2>你聽過「夢想孵化館」嗎？</h2>
        <div class="panels">
          <div class="panel"><div class="pic">🏟️</div><p>正修有一座<b>夢想孵化館</b>，裡面有六個科：土木、建築、機械、電機、電子、資工。</p></div>
          <div class="panel"><div class="pic">🥚</div><p>拿著門票進場的人，都能領到一顆<b>夢想蛋</b>。你陪它五年，它就會長成你的<b>職人夥伴</b>。</p></div>
          <div class="panel"><div class="pic">🎟️</div><p>門票分<b>四個時段</b>開賣。所以第一件事是：<b>學會搶票</b>。拿到票，再進場領蛋！</p></div>
        </div></div><button class="cta" id="ok">好，教我搶票</button>`);
      $("#ok").onclick = next;
    } },
    { id: "four", lab: "看售票時刻表", run() {
      const seen = new Set(S.x.seen || []); let open = "";
      const draw = () => {
        stage(`<div class="card"><p class="kicker">搶票教室 1／3</p><h2>門票一共有四種，一張接一張開賣</h2>
          <p><b>這一張沒買到，還有下一張。</b>點開每一張看看。</p>
          <div class="tix">${PORD.map(p => { const k = APP.skin[p]; return `<button class="tk ${open === p ? "open" : ""}" data-p="${p}" style="--c:${pcolor(p)}" aria-expanded="${open === p}">
            <div class="hd"><span>${k.icon}</span><span>第 ${D.paths[p].n} 張　${k.nick}</span></div><span class="st">${seen.has(p) ? "✅<br>看過" : "👆<br>點我"}</span>
            ${open === p ? `<div class="bd">${pathHTML(p)}</div>` : ""}</button>`; }).join("")}</div></div>
          <button class="cta" id="ok" ${seen.size < 4 ? "disabled" : ""}>${seen.size < 4 ? `還有 ${4 - seen.size} 張沒看` : "看懂了，來搶票！"}</button>`);
        $$(".tk").forEach(b => b.onclick = () => { open = open === b.dataset.p ? "" : b.dataset.p; if (open) { seen.add(open); S.x.seen = [...seen]; save(); } draw(); const el = $(".tk.open"); if (el) el.scrollIntoView({ block: "nearest" }); });
        $("#ok").onclick = () => { give("t4"); next(); };
      };
      draw();
    } },
    { id: "rush", lab: "搶票小遊戲", run() {
      let m = 0, pos = 0, last = 0, raf = 0, speed = 1, alive = true; const done = [];
      const range = {}; let acc = 0; SEGS.forEach(([k, w]) => { if (k) range[k] = [acc, acc + w]; acc += w; });
      const draw = () => {
        const M = MISSIONS[m];
        stage(`<div class="card"><p class="kicker">搶票教室 2／3｜任務 ${Math.min(m + 1, 3)}／3</p><h2 class="mission">${M ? M.t : "三張票都搶到了！"}</h2>
          <p class="small muted">${M ? "白色游標代表「現在的日期」。它走進彩色的開賣時段時，按下「搶票！」。也可以直接點那一格。" : "你已經知道四張票的先後順序了。"}</p>
          <div class="rail" id="rail">${SEGS.map(([k, w]) => k === "ex" ? `<div class="seg ex" style="width:${w}%">會<br>考</div>`
            : k ? `<button class="seg w ${done.includes(k) ? "done" : ""}" data-p="${k}" style="width:${w}%;--c:${pcolor(k)}">${APP.skin[k].nick.slice(0, 2)}<br>${APP.skin[k].nick.slice(2, 4)}</button>` : `<div class="seg" style="width:${w}%"></div>`).join("")}<div class="cur" id="cur"></div></div>
          <div class="months"><span>4 月底</span><span>5 月</span><span>6 月</span><span>7 月</span><span>之後</span></div>
          <div id="fb"></div><div class="got">${done.map(p => `<span class="tag" style="--c:${pcolor(p)}">✔ ${APP.skin[p].nick}</span>`).join("")}</div></div>
          ${M ? `<button class="cta grab" id="grab">🎟️ 搶票！</button>` : `<button class="cta" id="ok">下一步：搶票祕訣</button>`}`);
        if (!M) { $("#ok").onclick = next; return; }
        const judge = p => {
          if (p === M.p) { good(); done.push(p); m++; draw(); $("#fb").innerHTML = `<div class="hint">✅ ${M.yes}</div>`; if (m === 3) win(); return; }
          bad(); speed = Math.max(.6, speed - .15);
          $("#fb").innerHTML = `<div class="hint">💡 ${p ? MISS[p] + "任務要的不是這一張，再試一次。" : "現在還沒開賣。等游標走進彩色的格子再按。"}</div>`;
        };
        $("#grab").onclick = () => { const x = pos * 100; judge(Object.keys(range).find(k => x >= range[k][0] && x <= range[k][1]) || ""); };
        $$("#rail .w").forEach(b => b.onclick = () => judge(b.dataset.p));
      };
      const tick = t => {
        if (!alive || !document.body.contains($("#rail"))) { alive = false; return; }
        if (last) pos = (pos + (t - last) / 6500 * speed) % 1; last = t;
        const c = $("#cur"); if (c) c.style.left = `calc(${pos * 100}% - 2px)`;
        raf = requestAnimationFrame(tick);
      };
      draw(); raf = requestAnimationFrame(tick);
    } },
    { id: "tip", lab: "搶票祕訣", run() {
      let q = S.x.tipq || 0;
      const Q = [
        { q: `${who()}很想進夢想孵化館。什麼時候搶票最好？`, o: [["🐢", "等到最後一張再說", "越晚開賣的票，剩下的位子通常越少。想一想：哪一張最早開賣？"], ["🐦", "越早越好，先用「早鳥直達票」拿到門票", ""], ["🎲", "隨便挑一張", "有興趣的話，最早的那一張可以讓你最早安心喔。"]], ok: 1,
          yes: "沒錯！對正修六個科有興趣，建議參加越早的管道，先把入學門票拿到手。" },
        { q: "拿到門票之後，又有了其他選擇。怎麼辦？", o: [["🔒", "不能改了，只能用這一張", "別擔心，可以改的。關鍵是「期限」。"], ["🗓️", "在期限內辦理放棄，就可以選別的", ""]], ok: 1,
          yes: "答對了！先拿門票不吃虧，只要記得各管道的放棄期限。" }
      ];
      const ask = () => {
        const c = Q[q];
        stage(`<div class="card"><p class="kicker">搶票教室 3／3｜搶票祕訣 ${q + 1}／2</p><h2>${c.q}</h2>
          <div class="opts">${c.o.map((o, j) => `<button class="opt" data-j="${j}"><span>${o[0]}</span><span>${o[1]}</span></button>`).join("")}</div><div id="fb"></div></div><div id="nx"></div>`);
        $$(".opt").forEach(b => b.onclick = () => {
          const j = +b.dataset.j;
          if (j !== c.ok) { bad(); b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); $("#fb").innerHTML = `<div class="hint">💡 ${c.o[j][2]}</div>`; return; }
          good(); b.classList.add("ok"); $$(".opt").forEach(x => x.disabled = true);
          $("#fb").innerHTML = `<div class="hint">✅ ${c.yes}</div>${q === 1 ? `<div style="margin-top:10px">${warnHTML()}</div>` : ""}`;
          $("#nx").innerHTML = `<button class="cta">${q === 0 ? "下一題" : "拿著門票進場！"}</button>`;
          $("#nx button").onclick = () => { if (q === 0) { q = 1; S.x.tipq = 1; save(); ask(); } else { give("tip"); next(); } };
          $("#nx").scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
      };
      ask();
    }, back() { if (S.x.tipq) { S.x.tipq = 0; save(); go(S.step); return true; } } },
    { id: "gate", lab: "進場領蛋", run() {
      stage(`<div class="card"><p class="kicker">驗票成功！歡迎進場</p><h2>夢想館的館長將一顆夢想蛋交到你手上</h2>
        <div class="eggbox">${eggSVG(0, "wob")}</div>
        <p>「${who()}，這顆蛋現在還不知道自己會變成什麼。」</p>
        <p>「接下來的<b>五年</b>，就像在五專讀書的五年。你帶它做什麼，它就會長成什麼。<b class="remind">${REMIND}</b>，沒有對錯。」</p>
        <p class="small muted">每過一年，館內還會送你一份好消息。</p></div><button class="cta" id="ok">開始養蛋</button>`);
      $("#ok").onclick = () => { S.x.picks = []; S.x.r = 0; rescore(); next(); };
    } },
    { id: "egg", lab: "五年養成蛋", run() {
      S.x.picks = S.x.picks || []; let r = S.x.r || 0;
      const draw = () => {
        const R = ROUNDS[r]; S.x.picks.length = r; rescore(); const sel = new Set();
        stage(`<div class="card"><div class="year" aria-label="第 ${r + 1} 年，共 5 年">${ROUNDS.map((_, i) => `<i class="${i <= r ? "on" : ""}"></i>`).join("")}</div>
          <p class="kicker">養成第 ${r + 1} 年｜${R.yr}</p>
          <div class="eggbox">${eggSVG(r, "wob")}</div>
          <div class="badges">${[...new Set(S.x.picks.flat())].map(k => `<span style="--c:${DEPT[k].color}">${DEPT[k].icon}</span>`).join("")}</div>
          <div class="news"><b>🎁 今年的好消息</b><p>${R.adv()}</p></div>
          ${R.wing ? `<div class="news wing"><b>🪽 什麼是「五專展翅計畫」？</b><p>專四、專五可以申請。<b>合作企業</b>每個月給你至少 6,000 元生活獎學金，<b>教育部</b>補助專四、專五的學雜費。畢業後到這家企業工作 2 年，一畢業就有工作。</p></div>` : ""}
          <h2>${R.q}</h2><p class="remind">${REMIND}（可以複選，最多 3 個）</p>
          <div class="grid2 multi">${R.o.map(o => `<button class="opt" data-k="${o[0]}" aria-pressed="false"><span>${o[1]}</span><span>${o[2]}</span></button>`).join("")}</div></div>
          <button class="cta" id="ok" disabled>先選至少 1 個</button>`);
        const btn = $("#ok");
        $$(".opt").forEach(b => b.onclick = () => {
          const k = b.dataset.k;
          if (sel.has(k)) sel.delete(k); else { if (sel.size >= 3) return toast("最多選 3 個，先取消一個再選"); sel.add(k); }
          b.setAttribute("aria-pressed", sel.has(k)); beep([[600, .04]]);
          btn.disabled = !sel.size; btn.textContent = sel.size ? (r < 4 ? `選好了（${sel.size} 個），到下一年` : `選好了（${sel.size} 個），五年到了！`) : "先選至少 1 個";
        });
        btn.onclick = () => { good(); S.x.picks[r] = [...sel]; give(R.item); if (r < 4) { r++; S.x.r = r; save(); draw(); } else { rescore(); S.dept = ""; S.x.hatched = 0; save(); next(); } };
      };
      draw();
    }, back() { if (S.x.r > 0) { S.x.r--; S.x.picks.length = S.x.r; save(); go(S.step); return true; } } },
    { id: "hatch", lab: "孵化！", run() {
      rescore(); const top = topDept(); let taps = 0, pick = S.dept || top;
      const knock = () => {
        stage(`<div class="card" style="text-align:center"><p class="kicker">五年到了</p><h2>蛋殼裡有聲音！敲三下，幫它出來</h2>
          <div class="eggbox"><button id="egg" aria-label="敲蛋殼" style="padding:0">${eggSVG(4)}</button></div>
          <p class="small muted" id="cnt">敲 ${taps}／3 下</p></div>`);
        $("#egg").onclick = () => { taps++; beep([[300 + taps * 120, .1]]); const s = $("#egg svg"); s.classList.remove("shake"); void s.getBoundingClientRect(); s.classList.add("shake"); $("#cnt").textContent = `敲 ${taps}／3 下`; if (taps >= 3) setTimeout(() => { win(); confetti(); S.x.hatched = 1; save(); show(); }, 500); };
      };
      const show = () => {
        stage(`<div class="card"><p class="kicker">孵出來了！</p><h2>你的職人夥伴是「${PET[pick]}」，來自${DEPT[pick].name}</h2>
          <div class="eggbox">${petSVG(pick)}</div>
          <p class="small muted" style="text-align:center">${pick === top ? "這五年你最常選的，就是這一科的事。" : "這是你自己選的科。"}</p>
          ${deptHTML(pick)}</div>
          <div class="card"><h2>你覺得這個職人夥伴像你嗎？</h2><p><b>請選一個你最有興趣的科別。</b></p><p class="small muted">六個科各有厲害的地方，點一點可以看看別科的夥伴。</p>
          <div class="grid2">${DORD.map(k => `<button class="opt ${k === pick ? "sel" : ""}" data-k="${k}"><b>${DEPT[k].icon} ${DEPT[k].name}</b><small>夥伴「${PET[k]}」${k === top ? "｜蛋的選擇" : ""}</small></button>`).join("")}</div></div>
          <button class="cta" id="ok">就選${DEPT[pick].name}，領取${DEPT[pick].name}識別證</button>`);
        $$(".grid2 .opt").forEach(b => b.onclick = () => { pick = b.dataset.k; show(); });
        $("#ok").onclick = () => { S.dept = pick; give("pet"); next(); };
      };
      S.x.hatched ? show() : knock();
    } },
    { id: "final", lab: "我的識別證", run() {
      const d = DEPT[S.dept]; S.done = true; save(); win(); confetti();
      stage(`<div class="card"><p class="kicker">領取識別證</p><h2>恭喜！這是你的${d.name}識別證</h2><p>${who()}和「${PET[S.dept]}」一起領到了${d.name}識別證。門票搶到了，想讀的科也找到了。</p></div>
        <div class="card stub"><div class="top">${meHTML(64)}<div><div class="small" style="font-weight:900">夢想孵化館｜${d.name}識別證</div><div class="nm">${who()}</div></div><div style="margin-left:auto;font-size:44px">${d.icon}</div></div>
          <div class="cut"></div><div class="body">
          <dl class="kv"><dt>📚 科別</dt><dd>正修科技大學五專部 <b>${d.name}</b></dd><dt>🐣 夥伴</dt><dd>${PET[S.dept]}</dd>
          <dt>🎟️ 門票</dt><dd><b>早鳥直達票</b>（${D.paths.wan.name}）</dd><dt>🚀 未來</dt><dd>${d.jobs.join("、")}</dd></dl>
          <h3>早鳥直達票的關鍵時間</h3>${keyDatesHTML("wan")}
          <p class="small" style="margin-top:6px">🎁 ${D.bonus}</p><div class="bar"></div></div></div>
        <button class="cta" id="fDl">📥 下載我的${d.name}識別證</button>
        ${warnHTML()}
        <div class="card"><h2>搶票祕訣：越早越好</h2><p>對正修六個科有興趣，建議從最早的 <b>早鳥直達票</b> 開始，先拿到入學門票。之後有其他選擇，在期限內辦理放棄就可以。</p>
          <p class="small muted">這一張沒買到，還有下一張：</p>${steps4HTML("wan")}</div>
        <button class="cta" id="fTl">🗓️ 看關鍵時間，下載到行事曆</button>
        ${lineHTML()}
        <div class="row"><button class="cta ghost" id="fBag">🎒 打開百寶袋</button><a class="cta ghost" href="${d.url}" target="_blank" rel="noopener">${d.icon} ${d.name}網頁 ↗</a></div>
        <div class="card"><h3 style="margin-top:0">給你的小提醒</h3><p class="small">興趣可以慢慢找，這張識別證只是一個起點。把它下載或截圖存起來，帶著它和爸媽、老師聊聊你喜歡的科。</p>
          <p class="disc">招生日期和規定以 ${D.cycle} 正式招生簡章為準。</p></div>
        <button class="cta ghost" id="fAgain">🔄 換個選擇再玩一次</button>`);
      $("#fDl").onclick = () => saveCard({ title: `${d.name}識別證`, file: `正修五專-${d.name}識別證`, kicker: `夢想孵化館｜${d.name}識別證`, icon: d.icon,
        rows: [["科別", `正修科技大學五專部 ${d.name}`], ["夥伴", PET[S.dept]], ["門票", `早鳥直達票（${D.paths.wan.name}）`], ["學什麼", d.learn], ["未來", d.jobs.join("、")]] });
      $("#fTl").onclick = () => openTimes("wan"); $("#fBag").onclick = openBag; $("#fAgain").onclick = () => { reset(); go(0); };
    } }
  ]
};

boot();
</script>
</body>
</html>
